services:
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: welcome_wave
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
