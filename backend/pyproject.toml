[project]
name = "welcome-wave-backend"
version = "0.1.0"
description = "Welcome Wave onboarding backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion*", "retrieval*", "roadmap*", "verification*", "shared*"]
