[project]
name = "welcome-wave"
version = "0.1.0"
description = "Agentic, multimodal onboarding platform: KT-to-code linking, cited Q&A, task planning and PR review"
authors = [{ name = "Vijayabaskar" }, { name = "Aman Nautiyal" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary,pool]>=3.2",
  "sqlalchemy>=2.0",
  "pgvector>=0.3",
  "google-genai>=1.20",
  "google-cloud-storage>=2.17",
  "google-cloud-pubsub>=2.21",
  "firebase-admin>=6.5",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.8",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "langsmith>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "locust>=2.29"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B006", "B008"]
ignore = ["E731", "E741"]
[tool.ruff.lint.per-file-ignores]
"app/api/*" = ["B008"]
