# One SecretStore per workload identity, then one ExternalSecret per Kubernetes Secret. Secret Manager names are Terraform's
# (infra/terraform/secrets.tf: "ww-" + the name). Keys missing from a Secret are unset settings (backend/app/config.py).
# If the operator runs outside this cluster, add clusterLocation, clusterName and clusterProjectID under workloadIdentity.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-as-api
spec:
  provider:
    gcpsm:
      projectID: PROJECT_ID
      auth:
        workloadIdentity:
          serviceAccountRef: { name: api }
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-as-worker
spec:
  provider:
    gcpsm:
      projectID: PROJECT_ID
      auth:
        workloadIdentity:
          serviceAccountRef: { name: worker }
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-as-migrate
spec:
  provider:
    gcpsm:
      projectID: PROJECT_ID
      auth:
        workloadIdentity:
          serviceAccountRef: { name: migrate }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ww-api
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: gcp-as-api }
  target:
    name: ww-api
    creationPolicy: Owner
    deletionPolicy: Retain # a store that cannot be read never empties the Secret the pods use
  data:
    - { secretKey: DATABASE_URL, remoteRef: { key: ww-database-url } } # through the proxy's Unix socket
    - { secretKey: GITHUB_PRIVATE_KEY, remoteRef: { key: ww-github-app-private-key } }
    - { secretKey: GITHUB_WEBHOOK_SECRET, remoteRef: { key: ww-github-webhook-secret } }
    - { secretKey: GITHUB_CLIENT_SECRET, remoteRef: { key: ww-github-client-secret } }
    - { secretKey: GOOGLE_OAUTH_CLIENT_SECRET, remoteRef: { key: ww-google-oauth-client-secret } }
    - { secretKey: CALENDLY_WEBHOOK_SIGNING_KEY, remoteRef: { key: ww-calendly-webhook-signing-key } }
    - { secretKey: TOKEN_ENCRYPTION_KEY, remoteRef: { key: ww-token-encryption-key } }
    - { secretKey: LANGSMITH_API_KEY, remoteRef: { key: ww-langsmith-api-key } }
    - { secretKey: SMTP_PASSWORD, remoteRef: { key: ww-smtp-password } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ww-worker
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: gcp-as-worker }
  target:
    name: ww-worker
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - { secretKey: DATABASE_URL, remoteRef: { key: ww-database-url-proxy } } # 127.0.0.1:5432, the proxy sidecar
    - { secretKey: GITHUB_PRIVATE_KEY, remoteRef: { key: ww-github-app-private-key } }
    - { secretKey: LANGSMITH_API_KEY, remoteRef: { key: ww-langsmith-api-key } }
    - { secretKey: SMTP_PASSWORD, remoteRef: { key: ww-smtp-password } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ww-migrate
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: gcp-as-migrate }
  target:
    name: ww-migrate
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - { secretKey: DATABASE_URL_OWNER, remoteRef: { key: ww-database-url-owner } }
    - { secretKey: APP_DB_PASSWORD, remoteRef: { key: ww-app-db-password } }
