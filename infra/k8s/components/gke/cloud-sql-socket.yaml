# The Cloud SQL Auth Proxy beside the API (and the migration Job), serving a Unix socket in /cloudsql/<instance>: the
# DATABASE_URL Cloud Run uses (host=/cloudsql/<project>:<region>:<instance>) works unchanged. It is a native sidecar
# (restartPolicy: Always): it is ready before the app starts, stops after it, and lets the Job finish. Pinned by digest, like
# infra/k8s/workers.yaml; to update it, take the new release's digest from gcr.io/cloud-sql-connectors/cloud-sql-proxy.
- op: add
  path: /spec/template/spec/initContainers
  value:
    - name: cloud-sql-proxy
      image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.28.0@sha256:e0cbea7b63455c1635d354ef456696d019dd02a5db47bf1994e849823e71ae89
      restartPolicy: Always
      args:
        - --structured-logs
        - --unix-socket=/cloudsql
        - --health-check
        - --http-address=0.0.0.0
        - --exit-zero-on-sigterm
        - $(CLOUD_SQL_INSTANCE)
      env:
        - name: CLOUD_SQL_INSTANCE
          valueFrom: { configMapKeyRef: { name: ww-config, key: CLOUD_SQL_INSTANCE } }
      startupProbe: { httpGet: { path: /startup, port: 9090 }, periodSeconds: 1, failureThreshold: 60 }
      livenessProbe: { httpGet: { path: /liveness, port: 9090 }, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 6 }
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { memory: 256Mi }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
      volumeMounts:
        - { name: cloudsql, mountPath: /cloudsql }
- op: add
  path: /spec/template/spec/volumes/-
  value: { name: cloudsql, emptyDir: { sizeLimit: 1Mi } }
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value: { name: cloudsql, mountPath: /cloudsql }
