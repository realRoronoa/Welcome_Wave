# Container-native load balancing: the load balancer sends to the pods themselves (and a pod receives traffic only once it is
# ready there too), with each service's BackendConfig (ingress.yaml).
apiVersion: v1
kind: Service
metadata:
  name: api
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "api"}'
---
apiVersion: v1
kind: Service
metadata:
  name: web
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "web"}'
