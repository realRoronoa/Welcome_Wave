# Every pod in this namespace must meet the "restricted" Pod Security Standard: not root, no privilege escalation, every
# capability dropped, the runtime's seccomp profile. The API server refuses a pod that does not.
apiVersion: v1
kind: Namespace
metadata:
  name: welcome-wave
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
