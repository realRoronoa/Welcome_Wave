            - { name: SHUTDOWN_GRACE_S, value: "160" }
            - { name: HOME, value: /tmp }
            - { name: DB_POOL_SIZE, value: "3" }
            - { name: DB_MAX_OVERFLOW, value: "2" }
            - { name: CHECKPOINT_POOL_SIZE, value: "2" }
          envFrom:
            - configMapRef: { name: ww-config }
            - secretRef: { name: ww-worker }
          ports:
            - { name: health, containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 500m, memory: 1Gi, ephemeral-storage: 1Gi }
            limits: { memory: 1Gi, ephemeral-storage: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
