# Autoscaling and voluntary-disruption limits for the two services people talk to. Overlays set the bounds.
#
# The API scales on CPU. Each API pod holds up to 14 database connections (DB_POOL_SIZE 5 + DB_MAX_OVERFLOW 5 +
# CHECKPOINT_POOL_SIZE 4) and each worker pod up to 7, so maxReplicas is bounded by the database's max_connections
# (Cloud SQL: 300 dev, 400 prod; infra/terraform/data.tf): raise them together. Scale-down waits five minutes, so a short
# lull does not close the live-update streams that the pods hold.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: web }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
# A node drain or upgrade takes at most one pod of each away at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow # a pod that is not ready anyway never blocks a drain
  selector:
    matchLabels: { app.kubernetes.io/name: welcome-wave, app.kubernetes.io/component: api }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels: { app.kubernetes.io/name: welcome-wave, app.kubernetes.io/component: web }
