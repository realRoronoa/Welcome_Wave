# TEMPLATE ONLY: the three Secrets the pods read, with every key and no values. Kustomize never renders this file (it is
# not in kustomization.yaml), so applying an overlay can never overwrite a real Secret with an empty one.
#
# Never commit a filled copy. Choose one way to create them in the welcome-wave namespace:
#
#   1. External Secrets Operator (recommended): components/gcp-secret-manager makes these three from Google Secret Manager,
#      where Terraform and infra/scripts/set-secrets.sh already keep every value. Another store (Vault, AWS, Azure) works
#      the same way with its own SecretStore.
#   2. By hand, from files outside this repository (one KEY=value per line; a multi-line PEM as its own file):
#        kubectl -n welcome-wave create secret generic ww-api --from-env-file=ww-api.env \
#          --from-file=GITHUB_PRIVATE_KEY=github-app.pem
#        kubectl -n welcome-wave create secret generic ww-worker --from-env-file=ww-worker.env \
#          --from-file=GITHUB_PRIVATE_KEY=github-app.pem
#        kubectl -n welcome-wave create secret generic ww-migrate --from-env-file=ww-migrate.env
#      Change one: add --dry-run=client -o yaml | kubectl apply -f -, then `kubectl -n welcome-wave rollout restart deploy`
#      (pods read Secrets when they start).
#
# A key left out is simply unset. "unused" turns an optional feature off (backend/app/config.py). Which keys a mode needs:
# docs/KUBERNETES.md, "Secrets".
apiVersion: v1
kind: Secret
metadata:
  name: ww-api # the API
  namespace: welcome-wave
type: Opaque
stringData:
  # postgresql+psycopg://ww_app:<password>@<host>:5432/welcomewave  (the app role, never the owner)
  # GKE with the Cloud SQL Auth Proxy: ...@/welcomewave?host=/cloudsql/<project>:<region>:<instance>  (Secret Manager: ww-database-url)
  DATABASE_URL: ""
  GITHUB_PRIVATE_KEY: "" # the GitHub App's .pem
  GITHUB_WEBHOOK_SECRET: "" # 16+ random characters, the same as the GitHub App's; never "unused"
  GITHUB_CLIENT_SECRET: ""
  GOOGLE_OAUTH_CLIENT_SECRET: "" # Google Calendar + Meet; "unused" turns it off
  CALENDLY_WEBHOOK_SIGNING_KEY: "" # "unused" turns the Calendly webhook off
  TOKEN_ENCRYPTION_KEY: "" # any long random string; encrypts stored Google refresh tokens. Changing it disconnects Google
  LANGSMITH_API_KEY: "" # only with LANGSMITH_TRACING=true
  SMTP_PASSWORD: "" # only with SMTP_HOST
  # MODE=self_hosted only (components/self-hosted):
  GEMINI_API_KEY: "" # without it the AI is off, and the app says so
  BLOB_SIGNING_KEY: "" # signs the browser's links to recordings; empty = generated into the data volume
  GITHUB_TOKEN: "" # optional read-only token: private repositories (with GITHUB_ALLOWED_OWNERS), higher API limits
---
apiVersion: v1
kind: Secret
metadata:
  name: ww-worker # the three queue workers (MODE=gcp only)
  namespace: welcome-wave
type: Opaque
stringData:
  # GKE: postgresql+psycopg://ww_app:<password>@127.0.0.1:5432/welcomewave, through the proxy (Secret Manager: ww-database-url-proxy)
  DATABASE_URL: ""
  GITHUB_PRIVATE_KEY: ""
  LANGSMITH_API_KEY: ""
  SMTP_PASSWORD: "" # the review worker sends invitation emails
---
apiVersion: v1
kind: Secret
metadata:
  name: ww-migrate # the migration Job: the only place the owner's password is
  namespace: welcome-wave
type: Opaque
stringData:
  # postgresql://ww_owner:<password>@<host>:5432/welcomewave  (the database owner; plain postgresql://, no +psycopg)
  # GKE: ...@/welcomewave?host=/cloudsql/<project>:<region>:<instance>  (Secret Manager: ww-database-url-owner)
  DATABASE_URL_OWNER: ""
  APP_DB_PASSWORD: "" # the ww_app role's password: the one in ww-api's DATABASE_URL (Secret Manager: ww-app-db-password)
