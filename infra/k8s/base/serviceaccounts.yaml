# One identity per workload, so each can be given only what it needs (on GKE each maps to its own Google service account:
# components/gke). None of them talks to the Kubernetes API, so none gets a Kubernetes token in its pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migrate
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scheduler
automountServiceAccountToken: false
